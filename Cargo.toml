[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"

[workspace.dependencies]
bg-spec-core = { path = "crates/bg-spec-core" }
bg-spec-store = { path = "crates/bg-spec-store" }
bg-spec-indexer = { path = "crates/bg-spec-indexer" }
rmcp = { version = "3.9", features = ["server", "client", "macros", "transport-io"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "2.1"
openapiv3 = "2.2"
pdf_oxide = "0.3.78"
tantivy = "0.27"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "0.11"
walkdir = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
toml = "1.2"
schemars = "1"
tempfile = "3"
insta = { version = "1.49", features = ["json", "redactions"] }
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that add noise without improving this codebase.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
similar_names = "allow"
many_single_char_names = "allow"
struct_field_names = "allow"
# Readable `assert!(x.is_empty())` beats `assert_eq!(x, [] as [T; 0])`.
assert_is_empty = "allow"
# Ratios and scores over counts that never approach 2^52.
cast_precision_loss = "allow"
# Selected restriction/nursery lints.
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
use_self = "warn"
needless_collect = "warn"
significant_drop_in_scrutinee = "warn"
