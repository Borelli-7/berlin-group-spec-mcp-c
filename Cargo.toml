[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
bg-spec-core = { path = "crates/bg-spec-core" }
bg-spec-store = { path = "crates/bg-spec-store" }
bg-spec-indexer = { path = "crates/bg-spec-indexer" }
rmcp = { version = "3.5", features = ["server", "client", "macros", "transport-io"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = "1.3"
openapiv3 = "2.2"
pdf_oxide = "0.3.78"
tantivy = "0.26"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "0.11"
walkdir = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
toml = "0.9"
schemars = "1"
tempfile = "3"
insta = { version = "1.48", features = ["json"] }
hex = "0.4"
