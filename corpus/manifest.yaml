# Corpus manifest: the ONLY place where authority and precedence are declared.
# Authority is never inferred from file names. Paths are relative to this directory.
#
# Official Berlin Group publications (NextGenPSD2 v1.3.x and openFinance API Framework v2.x).
# Precedence ladder, kept distinct per authority so that no unintended precedence_tie arises:
#   100 normative implementation guidelines      95 normative data dictionary
#    90 technical OpenAPI contracts              85 normative domestic definitions
#    80 normative operational rules              50 informative guides / bulletins
#    10 project clarifications (text/v2/errata.md)
