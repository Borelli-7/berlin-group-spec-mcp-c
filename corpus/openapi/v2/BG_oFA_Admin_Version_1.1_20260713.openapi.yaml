        '400':
          $ref: '#/components/responses/decline_400_Administrative'
        '401':
          $ref: '#/components/responses/decline_401_Administrative'
        '403':
          $ref: '#/components/responses/decline_403_Administrative'
        '404':
          $ref: '#/components/responses/decline_404_Administrative'
        '405':
          $ref: '#/components/responses/decline_405_Administrative'
        '406':
          $ref: '#/components/responses/decline_406'
        '408':
          $ref: '#/components/responses/decline_408'
        '409':
          $ref: '#/components/responses/decline_409_Administrative'
        '415':
          $ref: '#/components/responses/decline_415'
        '500':
          $ref: '#/components/responses/decline_500'
        '503':
          $ref: '#/components/responses/decline_503'
  /v2/onboardings/{onboardingId}/certificates:
    post:
      summary: Information about a new QSealC of the API Client
      description: | 
        With this POST command the API Client informs the ASPSP that he will use for future calls a new certificate (QSealC) for message signing.
      operationId: informAboutNewQSeal
      tags:
        - Administrative API
      security:
        - {}
