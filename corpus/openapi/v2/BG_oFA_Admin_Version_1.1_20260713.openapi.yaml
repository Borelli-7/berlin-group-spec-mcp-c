openapi: 3.0.1

info:
  contact:
    email: info@berlin-group.org
    name: The Berlin Group - A European Standards Initiative
    url: https://www.berlin-group.org/
  description: |
    After conclusion of necessary contracts an API Client has to execute a technical onboarding at the openFinance API of an ASPSP.
    As part of the technical onboarding the ASPSP can check if all necessary contractual steps have been finished before.
    If everything is ok the ASPSP will assign a unique apiContractId to the API Client and will return this to the API Client as response of the technical onboarding.
    The API Client has to use this apiContractId for all further accesses to the extended services at the openFinance API of the ASPSP.
  license:
    name: Creative Commons Attribution 4.0 International Public License
    url: https://creativecommons.org/licenses/by/4.0/
  title: openFinance API Framework Implementation Guidelines Administrative Services
  version: "1.1"
  x-references:
    documents:
      - document:
        title: openFinance API Framework Data Dictionary
        version: "2.4"
      - document:
        title: openFinance API Framework Implementation Guidelines Administrative Services
        version: "1.1"

externalDocs:
  description: |
    openFinance API Framework
    Implementation Guidelines for Extended Services
  url: https://www.berlin-group.org/openfinance-downloads

servers:
  - url: https://api.testbank.com/psd2
    description: PSD2 server
  - url: https://test-api.testbank.com/psd2
    description: Optional PSD2 test server

tags:
  - name: Administrative API
    description: |
      The implementation of such an API would of course require the related banks to clarify the compliance with the related direct debit scheme rules. The related direct debit scheme could e.g. 
        * define requirements on the API clients who are permitted to consume the APIs,
        * could mandate a digital signature of the authorisation proof by the debtor bank or
        * could restrict the usage of such a service to specific mandate classes. 

paths:
  /v2/onboardings:
    post:
      summary: Initiation of the onboarding process
      description: | 
        Creates the onboarding resource at the ASPSP.
      operationId: initiateOnboarding
      tags:
        - Administrative API
      security:
        - {}
        - BearerAuthOAuth: []
      parameters:
        - $ref: '#/components/parameters/HEADER_digest'
        - $ref: '#/components/parameters/HEADER_xJwsSignature'
        - $ref: '#/components/parameters/HEADER_bodySigProfile'
        - $ref: '#/components/parameters/HEADER_xRequestId'
      requestBody:
        required: true
        content: 
          application/json:
            schema:
              type: object
              required:
                - schemeId
                - serviceIds
                - serviceContractId
              properties:
                schemeId:
                  description: |
                    Identification of the corresponding scheme, in case of no scheme involved use constant BILATERAL
                    Example: giroAPI-payment
                    The schemeIds supported by the ASPSP should be provided in the Discovery API [oFA Discov].
                  allOf:
                    - $ref: '#/components/schemas/Max70Text'
                serviceIds:
                  description: |
                    Identification of the extended services for which the onboarding will be done.
                    Possible values to identify a service have to be defined by the service owner (scheme or ASPSP).
                    The service types supported by the ASPSP should be provided in the Discovery API [oFA Discov].
                  type: array
                  items: 
                    $ref: '#/components/schemas/ServiceType'
                apiClientContacts:
                  description: |
                    Contacts (of different categories) of the API Client. Only to be given if not already available by e.g. a directory service.
                  type: array
                  items: 
                    $ref: '#/components/schemas/contact'
                serviceContractId:
                  description: |
                    Identification of the service contract concluded between the service owner (scheme or ASPSP) and the API Client to use these services.
                  allOf:
                    - $ref: '#/components/schemas/Max70Text'
      responses:
        '201':
          $ref: '#/components/responses/created_201_Admin'
        '400':
          $ref: '#/components/responses/decline_400_Administrative'
        '401':
          $ref: '#/components/responses/decline_401_Administrative'
        '403':
          $ref: '#/components/responses/decline_403_Administrative'
        '404':
          $ref: '#/components/responses/decline_404_Administrative'
        '405':
          $ref: '#/components/responses/decline_405_Administrative'
        '406':
          $ref: '#/components/responses/decline_406_Administrative'
        '408':
          $ref: '#/components/responses/decline_408_Administrative'
        '409':
          $ref: '#/components/responses/decline_409_Administrative'
        '415':
          $ref: '#/components/responses/decline_415_Administrative'
        '500':
          $ref: '#/components/responses/decline_500'
        '503':
          $ref: '#/components/responses/decline_503'
  /v2/onboardings/{onboardingId}/status:
    get:
      summary: Reading the status of the onboarding
      description: | 
        Reads the current Status of the onboarding process
      operationId: readOnboardingStatus
      tags:
        - Administrative API
      security:
        - {}
        - BearerAuthOAuth: []
      parameters:
        - $ref: '#/components/parameters/PATH_onboardingId'
        - $ref: '#/components/parameters/HEADER_xRequestId'
      responses:
        '200':
          $ref: '#/components/responses/Ok_200_Administrative_readOnboardingStatus'
        '400':
          $ref: '#/components/responses/decline_400_Administrative'
        '401':
          $ref: '#/components/responses/decline_401_Administrative'
        '403':
          $ref: '#/components/responses/decline_403_Administrative'
        '404':
          $ref: '#/components/responses/decline_404_Administrative'
        '405':
          $ref: '#/components/responses/decline_405_Administrative'
        '406':
          $ref: '#/components/responses/decline_406'
        '408':
          $ref: '#/components/responses/decline_408'
        '409':
          $ref: '#/components/responses/decline_409_Administrative'
        '415':
          $ref: '#/components/responses/decline_415'
        '500':
          $ref: '#/components/responses/decline_500'
        '503':
          $ref: '#/components/responses/decline_503'
  /v2/onboardings/{onboardingId}:
    get:
      summary: Reading the status of the onboarding
      description: | 
        Reads the current Status of the onboarding process
      operationId: readOnboardingResource
      tags:
        - Administrative API
      security:
        - {}
        - BearerAuthOAuth: []
      parameters:
