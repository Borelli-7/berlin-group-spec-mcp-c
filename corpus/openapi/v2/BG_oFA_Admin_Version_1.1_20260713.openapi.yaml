      description: CREATED
      content:
        application/json:
          schema:
            type: object
            required:
              - onboardingId
              - onboardingStatus
            properties:
              onboardingId:
                description: |
                  Unique identification of the onboarding resource created by this initiation.
                allOf:
                  - $ref: '#/components/schemas/Max70Text'
              onboardingStatus:
                description: |
                  Status of the onboarding process.
                allOf:
                  - $ref: '#/components/schemas/OnboardingStatus'
              apiContractId:
                description: |
                  Unique identification of the successful onboarding of the API Client for the list of services.
                  Shall be used by the API Client if accessing the services after the onboarding.
                  The attribute apiContractId shall only be provided if the onboarding resource has been created and the resource status is set to valid.
                  Otherwise this attribute shall be missing.
                allOf:
                  - $ref: '#/components/schemas/UUID'
              validTo:
                description: |
                  Date until when the successful onboarding is valid.
                  The attribute validTo shall only be provided if the onboarding resource has been created and the resource status is set to valid.
                  Otherwise this attribute shall be missing.
                allOf:
                  - $ref: '#/components/schemas/ISODate'
