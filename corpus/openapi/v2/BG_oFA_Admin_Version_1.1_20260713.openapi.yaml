                description: |
                  Indicates the date after which the API Client can access the services at the openFinance API of the ASPSP using the apiContractId returned with this response.
                allOf:
                  - $ref: '#/components/schemas/ISODate'
              _links:
                description: |
                  A list of hyperlinks to the next steps to read a price list and to confirm a price list.
                  The attribute _links shall only be provided if the technical onboarding requires the execution of the two step process according to section 2.2. Otherwise this attribute shall be missing.
                  If this attribute is provided it shall contain the following link:
                  • readConditions
                  • confirmConditions
                  Remark about future versions: Future versions of the data dictionary [oFA DaD] will contain the definition of these href types.
                allOf:
                  - $ref: '#/components/schemas/_links_201_Admin'
