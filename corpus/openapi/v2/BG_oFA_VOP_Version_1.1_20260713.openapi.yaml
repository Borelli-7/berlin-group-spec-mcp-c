          description: |
            This structure shall contain the party name and/or a  party identifier, 
            Related API Access Schemes might define further requirements.                    
          allOf:
            - $ref: '#/components/schemas/partyDescription4'
        partyNameMatch:
          description: |
            Only provided, if a party name has been provided.
          allOf:
            - $ref: '#/components/schemas/PartyNameMatchCode'
        partyIdMatch:
          description: |
            Only provided, if a party identification has been provided.
          allOf:
            - $ref: '#/components/schemas/PartyIdentificationMatchCode'
        matchedName:
          description: |
            This attribute might be provided in case of a near match and contains the name as provided by the addressed party agent.
          allOf:
            - $ref: '#/components/schemas/Max140Text'
        additionalInformation:
          description: |
            Should be human readable text.
          allOf:
            - $ref: '#/components/schemas/Max500Text'
