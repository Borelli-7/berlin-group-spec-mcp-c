  parameters:
    HEADER_bodySigProfile:
      name: Body-Sig-Profile 
      in: header
      description: |
         Indicates the signature profile used for signing (parts of) the body. Shall be used if the body is signed.
      required: false
      schema:
        type: string
        enum:
          - JAdES_JS
          - XAdES
          - EMV_AC
          - EUDIW
      example: 'XAdES'
    PATH_paymentProduct_all:
      name: payment-product
      in: path
      description: |
         The payment product, under which the payment under paymentId has been initiated.
         It shall be checked by the ASPSP, if the payment-product is matching the payment initiation addressed by paymentId.
      required: true
      schema:
        type: string
        enum:
          - sepa-credit-transfers
          - instant-sepa-credit-transfers
          - target-2-payments
          - cross-border-credit-transfers
          - pain.001-sepa-credit-transfers
          - pain.001-instant-sepa-credit-transfers
          - pain.001-target-2-payments
          - pain.001-cross-border-credit-transfers
          - pain.001-proprietary-credit-transfers
      example: 'sepa-credit-transfers'
    HEADER_apiContractId:
      name: API-Contract-ID
      in: header
      description: |
        Might be mandated by the ASPSP, if a commercial agreement is needed for the usage of the service.
      schema:
        type: string
        format: uuid
      required: false
      example: '99435d7f-ad87-4aec-a2ae-99ddcb1f6555'
    PATH_paymentService:
      name: payment-service
      in: path
      description: |
        Payment service:
        Possible values are:
        * payments
        * bulk-payments
        * periodic-payments
      required: true
      schema:
        type: string
        enum:
          - payments
          - bulk-payments
          - periodic-payments
      example: 'payments'
    HEADER_xRequestId:
      name: X-Request-ID
      in: header
      description: |
        ID of the request, unique to the call, as determined by the initiating party.
        This is the unique ID of the API Client for the payment initiation regarding PSD2 article 47 and EBA RTS article 29.
      required: true
      schema:
        type: string
        format: uuid
      example: '99391c7e-ad88-49ec-a2ad-99ddcb1f7721'
    PATH_partyVerificationBulkEndpoint:
      name: bulk-party-verification-endpoint
      in: path
      description: |
        The following values are supported in this specification:
        * bulk-payee-verifications: A service to fulfil related verifications for a bulk of payees. 
        * bulk-payer-verifications: A service to fulfil related verifications for a bulk of payers.
        * bulk-party-verifications: A general service independent of the underlying payment scheme just addressing a a bulk of counterparties.
      required: true
      schema:
        type: string
        enum:
          - bulk-payee-verifications
          - bulk-payer-verifications
          - bulk-party-verifications
      example: 'bulk-payee-verifications'
    PATH_paymentId:
      name: paymentId
      in: path
      description: Resource identification of the related payment.
      required: true
      schema:
        $ref: '#/components/schemas/Max70Text'
      example: 'fe7552ee-0728-4bd1-baf7-94942331e478'
    HEADER_bodyEncList:
      name: Body-Enc-List
      in: header
      description: |
          Contains a List of names of data elements/ attributes of the body which contain encrypted information
      required: false
      schema:
        type: string
      example: 'BODY'
    HEADER_bodyEncProfile:
      name: Body-Enc-Profile 
      in: header
      description: |
         Indicates the encryption profile used for the encryption of (parts of) the body.
      required: false
      schema:
        type: string
        enum:
          - JWE_CS
          - XML_ENC
      example: 'JWE_CS'
    PATH_partyVerificationEndpoint:
      name: party-verification-endpoint
      in: path
      description: |
        The following values are supported in this specification:
        * payee-verifications: A service to fulfil related verifications for payees. 
        * payer-verifications: A service to fulfil related verifications for payers.
        * party-verifications: A general service independent of the underlying payment scheme just addressing a counterparty.
      required: true
      schema:
        type: string
        enum:
          - payee-verifications
          - payer-verifications
          - party-verifications
      example: 'payee-verifications'
    PATH_vopBulkId:
      name: vopBulkId
      in: path
      description: |
        Technical resource identification of the VOP bulk.
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
      example: 'aaaaaaaa-ad88-49ec-a2ad-99ddcb1f7798'
    HEADER_acceptLanguage:
      name: Accept-language
      in: header
      description: |
        The API Client may ask for a language for free text fields in the related response (i.e. in additionalInformation).
        This header might be ignored by the ASPSP, if the addressed language is not supported. 
        If not supported the default language of the ASPSP will be used.
      schema:
        type: string
      required: false
      example: 'en-gb,en;0.8'
    HEADER_xJwsSignature:
      name: x-jws-signature
      in: header
      description: |
        The attribute x-jws-signature contains the JSON Web Signature.
      schema:
        type: string
      required: false # conditional
      example: '..NuGglWBtHcXavob2ZmW-PoSpMmhJS9U6z8zPqHFoE97vHI3z8wtaVdbwsj5WzgPjtVWUUnk8cxP4JjLXdwzwhhHB2uJ5FI4ZZGdSQQw-9pXPUx3cCJSzHmrgkJ-di-A4'
    HEADER_digest:
      name: Digest
      in: header
      description: |
        When API Client include a signature according to this signature profile, they also must include a \"Digest\" header as defined in [RFC3230]. 
        The \"Digest\" Header contains a Hash of the message body. If the message does not contain a body, the \"Digest\" header must contain the hash of an empty byte list.
        The only hash algorithms that may be used to calculate the Digest within the context of this specification are SHA-256 and SHA-512 as defined in [RFC5843]. 
      schema:
        type: string
      required: false # conditional
      example: 'SHA-256=hl1/Eps8BEQW58FJhDApwJXjGY4nr1ArGDHIT25vq6A='
    HEADER_clientAsynchronousProcessPreferred:
      name: Client-Asynchronous-Process-Preferred
      in: header
      description: |
        true: Asynchronous process preferred.
        false: Synchronous process preferred.
        The ASPSP may ignore this flag.
      required: false
      schema:
        type: boolean
      example: true
