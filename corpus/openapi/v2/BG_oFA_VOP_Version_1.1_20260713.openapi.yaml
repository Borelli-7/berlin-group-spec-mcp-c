            The data type might be restricted by the ASPSP to e.g. "iban" use only, which would be Account Reference2 as data type.
          allOf:
            - $ref: '#/components/schemas/accountReference'
        partyAgent:
          description: |
          allOf:
            - $ref: '#/components/schemas/agentDescription'
