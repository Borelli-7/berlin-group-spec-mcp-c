    tppMessage_400_AIS:
      type: object
      required:
        - category
        - code
      properties:
        category:
           $ref: '#/components/schemas/TppMessageCategory'
        code:
          $ref: '#/components/schemas/MessageCode_400_AIS'
        path:
          type: string
        text:
          $ref: '#/components/schemas/Max500Text'
    securitiesOrder:
      description: |
        Represents a securities order.
      type: object
      required: 
        - side
        - financialInstrument
        - orderStatus
      properties:
        orderId:
          allOf:
            - description: |
                Can be used as access-ID in the API, where more details on an order is offered. 
                If this data attribute is provided, this shows that the AIS can get access on more 
                details about this transaction using the Read Securities Transaction Details Request.
                *Remark:* In anticipation of future services where orders might be placed or revoked via the 
                openFinance API, the orderId should be defined in a way that it will also identify an order in 
                the case of a placement / cancellation, if the ASPSP intends to support those use cases, as well.
            - type: string
        side:
          allOf:
            - description: |
                Type of transaction that is associated with this order.
            - $ref: '#/components/schemas/SecuritiesOrderSide'
        financialInstrument:
          allOf:
            - description: |
                Financial instrument the order refers to.
            - $ref: '#/components/schemas/financialInstrument'
        unitsNumberOrder:
          allOf:
            - description: |
                Numeric quantification of the financial instrument that is ordered.
            - type: number
        unitsNominalOrder:
          allOf:
            - description: |
                Nominal quantification of the financial instrument that is ordered.
            - $ref: '#/components/schemas/amount'
        unitsNumberDisplay:
          allOf:
            - description: |
                Numeric quantification of the order that shall be displayed.
            - type: number
        unitsNominalDisplay:
          allOf:
            - description: |
                Nominal quantification of the order that shall be displayed.
            - $ref: '#/components/schemas/amount'
        placeOfTrade:
          allOf:
            - description: |
            - $ref: '#/components/schemas/marketIdentification'
        limitPriceAmount:
              $ref: '#/components/schemas/amount'
        limitPricePercent:
          description: Up to 20 significant figures. Negative amounts are signed by minus.
            The decimal separator is a dot. Trailing zeroes must be truncated.
          type: string
          pattern: "-?[0-9]{1,20}(\\.[0-9]{0,19})?"
        stopPriceAmount:
              $ref: '#/components/schemas/amount'
        stopPricePercent:
          description: Up to 20 significant figures. Negative amounts are signed by minus.
            The decimal separator is a dot. Trailing zeroes must be truncated.
          type: string
          pattern: "-?[0-9]{1,20}(\\.[0-9]{0,19})?"
        tradingSessionIndicator:
          allOf:
            - description: |
                Type of transaction that is associated with this order.
            - $ref: '#/components/schemas/TradingSessionTypeCode'
        typesOfOrder:
          allOf:
            - description: |
                One or more Codes to indicate characteristics of the order.
            - type: array
              items:
                $ref: '#/components/schemas/TypeOfOrderCode'
        timeInForce:
          allOf:
            - description: |
                If the order is restricted by a time limit, the type time limit is indicated by a value of 
                the corresponding code set.
            - $ref: '#/components/schemas/OrderTimeLimitCode'
        expiryDate:
          allOf:
            - description: |
                Date, when the order expires, if applicable.
            - $ref: '#/components/schemas/ISODate'
        expiryDateTime:
          allOf:
            - description: |
                Date and time, when the order expires, if applicable.
            - $ref: '#/components/schemas/ISODateTime'
        relatedCashAccount:
          allOf:
            - description: |
                If the execution of this order implies the transfer of money, cash account to be affected by this 
                transfer from the PSU's side.
            - $ref: '#/components/schemas/accountReference'
        orderSplit:
          allOf:
            - description: |
                Value true indicates that this order is the result of an order split. Missing values indicate \"false\".
            - type: boolean
        orderModifyable:
          allOf:
            - description: |
                Value true indicates that this order can (still) be modified. Missing values indicate \"false\".
            - type: boolean
        orderStatus:
          allOf:
            - description: |
                Status of the order.
            - $ref: '#/components/schemas/OrderStatusCode'
        details:
          allOf:
            - description: |
                Additional details to the order.
            - $ref: '#/components/schemas/Max500Text'
        _links:
          allOf:
            - description: |
            - type: object
              additionalProperties: 
                oneOf:
                  - $ref: '#/components/schemas/hrefType'
                  - type: array
                    items:
                      $ref: '#/components/schemas/hrefType'
              properties:
                relatedOrders:
                  allOf:
                    - description: |
                        An array of links to request order details of related orders (e.g. other
                        orders that originated from the same order split as this order).
                        Only applicable, if the ASPSP supports the Read Securities Order Details endpoint.
                    - type: array
                      items:
                        $ref: '#/components/schemas/hrefType'
                relatedTransactions:
                  allOf:
                    - description: |
                        An array of links to request securities transaction details of transactions that resulted
                        from this order. 
                        Only applicable, if the ASPSP supports the Read Securities Transaction Details endpoint.
                    - type: array
                      items:
                        $ref: '#/components/schemas/hrefType'
                orderDetails:
                  allOf:
                    - description: |
                        Single link for retrieving details on this specific order. 
                        Only applicable, if the ASPSP supports the Read Securities Order Details endpoint.
                    - $ref: '#/components/schemas/hrefType'
    error_NG_401_AIS: 
      type: object
      properties:
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/tppMessage_401_AIS'
        _links:
          $ref: '#/components/schemas/_linksAll'
    error_NG_404_AIS_Securities: 
      type: object
      properties:
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/tppMessage_404_AIS_Securities'
        _links:
          $ref: '#/components/schemas/_linksAll'
    tppMessage_409_AIS:
      type: object
      required:
        - category
        - code
      properties:
        category:
           $ref: '#/components/schemas/TppMessageCategory'
        code:
          $ref: '#/components/schemas/MessageCode_409_AIS'
        path:
          type: string
        text:
          $ref: '#/components/schemas/Max500Text'
    ISODateTime:
      type: string
      format: date-time
    TypeOfPrice17Code:
      description: |
        TypeOfPrice17Code from ISO 20022.
        Compare 
        ISO 20022
        Settlement And Reconciliation - ISO - Maintenace 2019 - 2020
        Message Definition Report - Part 2
        Approved by the Securities SEG on the 27th of January 2020:
        <table border="1">
          <tr>
            <th>CodeName</th>
            <th>Name</th>
            <th>Definition</th>
          </tr>
          <tr>
            <td>BIDE</td>
            <td>Bid</td>
            <td>
              Price is the calculated bid price of a dual-priced fund (offer-bid prices), that is, 
              the selling price of the units for the investor.
            </td>
          </tr>
          <tr>
            <td>OFFR</td>
            <td>Offer</td>
            <td>
              Price is the calculated offer price of a dual-priced investment fund (offer-bid prices), 
              that is, the buying price of the units for an investor.
            </td>
          </tr>
          <tr>
            <td>NAVL</td>
            <td>NetAssetValue</td>
            <td>
              Price is the net asset value per unit that is used either as a transacting price for a single-priced 
              investment fund class, or as a notional price for the calculation of other prices.
            </td>
          </tr>
          <tr>
            <td>CREA</td>
            <td>Creation</td>
            <td>
              Price is the calculated creation price of a dual-priced investment fund (creation-cancellation 
              prices) and the highest possible buying price of the units before the initial charge. 
              The actual buying or offer price, which includes charges, will be higher.
            </td>
          </tr>
          <tr>
            <td>CANC</td>
            <td>Cancellation</td>
            <td>
              Price is the calculated cancellation price of a dual-priced investment fund (creation-cancellation 
              price), and the lowest possible valuation of the units on any one-day. 
              The actual selling or bid price is usually higher.
            </td>
          </tr>
          <tr>
            <td>INTE</td>
            <td>Interim</td>
            <td>Price is the non-official interim price given to an investor before the executed price.</td>
           </tr>
          <tr>
            <td>SWNG</td>
            <td>Swing</td>
            <td>
               Price is the calculated net asset value price of a single-priced investment fund.
               The price is adjusted to take into accountthe dealing costs due to individual large
               deals, or due to a significant imbalance in volumes of subscriptions vs redemptions, 
               as an alternative to dilutionlevy.
             </td>
          </tr>
          <tr>
            <td>MIDD</td>
            <td>Mid</td>
            <td>Price is the average price between the bid and offer prices.</td>
          </tr>
          <tr>
            <td>RINV</td>
            <td>Reinvestment</td>
            <td>Price is the price used when reinvesting units after distribution.</td>
          </tr>
          <tr>
            <td>SWIC</td>
            <td>Switch</td>
            <td>Price is the price used when transferring units between products.</td>
          </tr>
          <tr>
            <td>MRKT</td>
            <td>Market</td>
            <td>Price is the current market price.</td>
          </tr>
          <tr>
            <td>INDC</td>
            <td>Indicative</td>
            <td>Price is the estimated indicative price.</td>
          </tr>
          <tr>
            <td>DDVR</td>
            <td>DailyDividendRate</td>
            <td>
              Price is the net income of a financial instrument, calculated on each dealing
              day, and divided by all the units outstanding on that day.
            </td>
          </tr>
          <tr>
            <td>ACTU</td>
            <td>Actual</td>
            <td>True offer price.</td>
          </tr>
        </table>
      type: string
      enum:
        - BIDE
        - OFFR
        - NAVL
        - CREA
        - CANC
        - INTE
        - SWNG
        - MIDD
        - RINV
        - SWIC
        - MRKT
        - INDC
        - DDVR
        - ACTU
    securitiesAccountFee:
      description: |
        Represents the parameters of a given type of fee as they apply to the securities account.
      type: object
      required: 
        - feeRules
      properties:
        typeCode:
          allOf:
            - description: |
                Type of the fee as a code.
                Might be adjusted in the future based on market experience.
            - $ref: '#/components/schemas/SecuritiesFeeTypeCode'
        typeProprietary:
          allOf:
            - description: |
                Type of the fee as a proprietary string.
            - $ref: '#/components/schemas/Max35Text'
        feeRules:
          allOf:
            - description: |
            - type: array
              items: 
                $ref: '#/components/schemas/securitiesAccountFeeRule'
        applicableFrom:
          allOf:
            - description: |
                First date, when this fee is applicable.
                If not present, the fee is applicable starting with the
                creation of this account / the latest reporting date supported by the ASPSP.
            - $ref: '#/components/schemas/ISODate'
        applicableTo:
          allOf:
            - description: |
                Last date, when this fee is applicable.
                If not present, the fee is applicable indefinitely.
            - $ref: '#/components/schemas/ISODate'
        additionalInformation:
          allOf:
            - description: |
            - $ref: '#/components/schemas/Max500Text'
    Max4Text:
      type: string
      maxLength: 4
    OrderTimeLimitCode:
      description: |
        Code set to identify the time an order shall be in force. 
      type: string
      enum:
        - day
        - goodTillCancel
        - atTheOpening
        - immediateOrCancel
        - fillOrKill
        - fillAndKill
        - goodTillCrossing
        - goodTillDate
        - atTheClose
        - goodThroughCrossing
        - atCrossing
        - goodForTime
        - goodForAuction
        - goodForMonth
  parameters:
    HEADER_psuAccept:
      name: PSU-Accept
      in: header
      description: |
        The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
      schema:
        type: string
      required: false
    HEADER_psuGeoLocation:
      name: PSU-Geo-Location
      in: header
      description: |
        The forwarded Geo Location of the corresponding http request between PSU and TPP if available.
      schema:
        type: string
        pattern: 'GEO:-?[0-9]{1,2}\.[0-9]{6};-?[0-9]{1,3}\.[0-9]{6}'
      required: false
      example: GEO:52.506931;13.144558
    HEADER_psuAcceptEncoding:
      name: PSU-Accept-Encoding
      in: header
      description: |
        The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
      schema:
        type: string
      required: false
    PATH_orderId:
      name: orderId
      in: path
      description: |
        This identification is given by the attribute orderId of the corresponding entry of an order list.
      required: true
      schema:
        type: string
        example: "3dc3d5b3-order-f5400a64e80f"
    HEADER_psuAcceptCharset:
      name: PSU-Accept-Charset
      in: header
      description: |
        The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
      schema:
        type: string
      required: false
    HEADER_psuDeviceId:
      name: PSU-Device-ID
      in: header
      description: |
        UUID (Universally Unique Identifier) for a device, which is used by the PSU, if available.
        UUID identifies either a device or a device dependant application installation.
        In case of an installation identification this ID needs to be unaltered until removal from device.
      schema:
        type: string
        format: uuid
      required: false
      example: "99435c7e-ad88-49ec-a2ad-99ddcb1f5555"
    QUERY_dateTo:
      name: dateTo
      in: query
      description: |
        End date (inclusive the data dateTo) of the transaction list, default is \"now\" if not given. 
        Might be ignored if a delta function is used.
        For booked transactions, the relevant date is the booking date. 
        For pending transactions, the relevant date is the entry date, which may not be transparent 
        neither in this API nor other channels of the ASPSP.
      required: false
      schema:
        type: string
        format: date
    QUERY_evaluationCurrency:
      name: evaluationCurrency
      in: query
      description: |
        ISO Alpha-3 currency code to request evaluation of the balances in a specific currency.
        This query parameter might be ignored by the ASPSP, if evaluation is not supported for variable 
        currencies or does not support evaluation in the requested currency. 
      required: false
      schema:
        type: string
    HEADER_psuUserAgent:
      name: PSU-User-Agent
      in: header
      description: |
        The forwarded Agent header field of the HTTP request between PSU and TPP, if available.
      schema:
        type: string
      required: false
    HEADER_psuIpAddress_conditionalForAis:
      name: PSU-IP-Address
      in: header
      description: |
        The forwarded IP Address header field consists of the corresponding HTTP request 
        IP Address field between PSU and TPP. 
        It shall be contained if and only if this request was actively initiated by the PSU.
      schema:
        type: string
        format: ipv4
      required: false
      example: 192.168.8.78
    HEADER_tppSignatureCertificate:
      name: TPP-Signature-Certificate
      in: header
      description: |
        The certificate used for signing the request, in base64 encoding. 
        Must be contained if a signature is contained.
      schema:
        type: string
        format: byte
      required: false # conditional
    QUERY_entryReferenceFrom:
      name: entryReferenceFrom
      in: query
      description: |
        This data attribute is indicating that the AISP is in favour to get all transactions after 
        the transaction with identification entryReferenceFrom alternatively to the above defined period. 
        This is a implementation of a delta access. 
        If this data element is contained, the entries \"dateFrom\" and \"dateTo\" might be ignored by the ASPSP 
        if a delta report is supported.
        Optional if supported by API provider.
      required: false
      schema:
        type: string
    HEADER_xRequestId:
      name: X-Request-ID
      in: header
      description: ID of the request, unique to the call, as determined by the initiating party.
      required: true
      example: "99391c7e-ad88-49ec-a2ad-99ddcb1f7721"
      schema:
        type: string
        format: uuid
    HEADER_signature:
      name: Signature
      in: header
      description: |
        A signature of the request by the TPP on application level. This might be mandated by ASPSP.
      schema:
        type: string
      required: false # conditional
      example: >
        keyId="SN=9FA1,CA=CN=D-TRUST%20CA%202-1%202015,O=D-Trust%20GmbH,C=DE",algorithm="rsa-sha256",
        headers="Digest X-Request-ID PSU-ID TPP-Redirect-URI Date",
        signature="Base64(RSA-SHA256(signing string))"
    PATH_transactionId:
      name: transactionId
      in: path
      description: |
        This identification is given by the attribute transactionId of the corresponding entry of a transaction list.
      required: true
      schema:
        type: string
        example: "3dc3d5b3-7023-4848-9853-f5400a64e80f"
    HEADER_psuAcceptLanguage:
      name: PSU-Accept-Language
      in: header
      description: |
        The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
      schema:
        type: string
      required: false
    HEADER_psuHttpMethod:
      name: PSU-Http-Method
      in: header
      description: |
        HTTP method used at the PSU ? TPP interface, if available.
        Valid values are:
        * GET
        * POST
        * PUT
        * PATCH
        * DELETE
      schema:
        type: string
        enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
      required: false
    QUERY_deltaList:
      name: deltaList
      in: query
      description: 
        This data attribute is indicating that the AISP is in favour to get all transactions after the last report access 
        for this PSU on the addressed account. 
        This is another implementation of a delta access-report.
        This delta indicator might be rejected by the ASPSP if this function is not supported.
        Optional if supported by API provider
      schema:
        type: boolean
    HEADER_psuIpPort:
      name: PSU-IP-Port
      in: header
      description: |
        The forwarded IP Port header field consists of the corresponding HTTP request IP Port field between PSU and TPP, if available.
      schema:
        type: string
      required: false
      example: "1234"
    QUERY_orderStatus:
      name: orderStatus
      in: query
      description: |
        Comma separated list of Order Status Code
        Restricts the result to orders that are currently assigned to one of the status values provided in 
        this query parameter.
        If the parameter is not provided, orders are provided without restriction to their respective status.
      required: false
      schema:
        type: string
    PATH_securitiesAccountId:
      name: securities-account-id
      in: path
      description: |
        This identification is denoting the addressed securities account. 
        The securities-account-id is retrieved by using a \"Read Securities Account List\". 
        The securities-account-id is the \"resourceId\" attribute of the securities account structure. 
        Its value is constant at least throughout the lifecycle of a given consent.
      required: true
      schema:
        type: string
        example: "1234-SecAct-983"
    HEADER_consentId_mandatory:
      name: Consent-ID
      in: header
      description: |
        This then contains the consentId of the related AIS consent, which was performed prior to this payment initiation.
      required: true
      schema:
        type: string
        example: "123cons456"
    HEADER_digest:
      name: Digest
      in: header
      description: Is contained if and only if the \"Signature\" element is contained in the header of the request.
      schema:
        type: string
      required: false # conditional
      example: "SHA-256=hl1/Eps8BEQW58FJhDApwJXjGY4nr1ArGDHIT25vq6A="
    QUERY_dateFrom:
      name: dateFrom
      in: query
      description: |
        Conditional: Starting date (inclusive the date dateFrom) of the transaction list, mandated if no delta access is required
        and if bookingStatus does not equal \"information\".
        For booked transactions, the relevant date is the booking date. 
        For pending transactions, the relevant date is the entry date, which may not be transparent 
        neither in this API nor other channels of the ASPSP.
      required: false
      schema:
        type: string
        format: date
  requestBodies: {}
