    accountReference:
      description: | 
        This type is containing any account identification which can be used on payload-level to address specific 
        accounts. The ASPSP will document which account reference type it will support.
      type: object
      properties: 
        iban: 
          allOf:
            - description: |
            - $ref: '#/components/schemas/IBAN'
        bban:  
          allOf:
            - description: |
                This data element can be used for accounts when no IBAN is provided.
            - $ref: '#/components/schemas/BBAN'
        pan:  
          allOf:
            - description: |
                Primary Account Number (PAN) of a card, can be tokenised by the ASPSP due to PCI DSS requirements. 
            - $ref: '#/components/schemas/Max35Text'
        maskedPan:  
          allOf:
            - description: |
                Primary Account Number (PAN) of a card in a masked form.
            - $ref: '#/components/schemas/Max35Text'
        msisdn:  
          allOf:
            - description: |
                An alias to access a payment account via a registered mobile phone number. 
            - $ref: '#/components/schemas/Max35Text'
        other: 
          allOf:
            - description: |
                In cases where the criteria listed above (IBAN, BBAN,MSISDN) are not provided to 
                identify the account (e.g. a securities account), the ASPSP shall support delivery 
                of a proprietary ID of the respective account that uniquely identifies the account 
                for this ASPSP. This ID will be delivered within the \"other\" structure.
                In this case, the ASPSP specifically shall support consent establishment for an account 
                identified by its proprietary ID.
                **Remark:** An ASPSP does not have to support the \"other\" element for (regular payment) 
                accounts.
            - $ref: '#/components/schemas/otherType'
        currency:
          allOf:
            - description: |
                ISO 4217 Alpha 3 currency code
            - $ref: '#/components/schemas/CurrencyCode'
        cashAccountType:
          allOf:
            - description: |
                ExternalCashAccountType1Code from ISO 20022. Might be extended by an additional code to indicate securities accounts. 
                A global definition of a code for securities accounts is intentionally not provided by this document.
                The API provider may restrict the accepted values further (e.g. only \"SVGS\" and \"CACC\" may be supported). 
                The TPP includes this element, if the account reference may identify several accounts of different types, 
                but the TPP only requests access to a specific type (e.g. card accounts).
                If the cashAccountType is not present, it indicates the cashAccountType
                * \"Card Account\" in case of the account identification being provided as a maskedPan or a pan and 
                * \"Current Account\" (CACC) otherwise.                    
            - $ref: '#/components/schemas/ExternalCashAccountType'
    IBAN:
      type: string
      description: IBAN of an account.
      pattern: "[A-Z]{2,2}[0-9]{2,2}[a-zA-Z0-9]{1,30}"
      example: "FR7612345987650123456789014"
    securitiesTransaction:
      description: Represents a securities transaction.
      type: object
      required: 
        - relevantDates
        - financialInstrument
      properties:
        transactionId:
          allOf:
            - description: |
                Can be used as access-ID in the API, where more details on a transaction is offered. 
                If this data attribute is provided, this shows that the AIS can get access on more details 
                about this transaction using the Read Securities Transaction Details Request.
            - type: string
        entryReference:
          allOf:
            - description: |
                Identification of the transaction as used e.g. for reference for deltafunction on application level. 
            - $ref: '#/components/schemas/Max35Text'
        relevantDates:
          allOf:
            - description: |
            - type: array
              items:
                $ref: '#/components/schemas/securitiesRelatedDateOrTime'
        financialInstrument:
          allOf:
            - description: |
                Financial instrument that was transferred within the transaction.
            - $ref: '#/components/schemas/financialInstrument'
        orderId:
          allOf:
            - description: |
                Resource Id of the order resource that triggered this transaction, if applicable.
            - type: string
        unitsNumber:
          allOf:
            - description: |
                Numeric quantification of the financial instrument. Negative values indicate that 
                the respective quantity of the financial instrument has been taken from the securities
                account, positive values indicate that the quantity hasbeen added.
            - type: number
        unitsNominal:
          allOf:
            - description: |
                Nominal quantification of the financial instrument. Negative values indicate that 
                the respective quantity of the financial instrument has been taken from the securities
                account, positive values indicate that the quantity hasbeen added.
            - $ref: '#/components/schemas/amount'
        transactionTypeCode:
          allOf:
            - description: |
                Type of the transaction as code.
            - $ref: '#/components/schemas/TransactionActivityType1Code'
        transactionTypeProprietary:
          allOf:
            - description: |
                Type of the transaction as a proprietary string.
            - $ref: '#/components/schemas/Max35Text'
        placeOfTrade:
          allOf:
            - description: |
            - $ref: '#/components/schemas/marketIdentification'
        amountIncludesFees:
          allOf:
            - description: |
                Indicates whether the transactionAmount (see below) is including fees. Default: false
            - type: boolean
        amountIncludesTaxes:
          allOf:
            - description: |
                Indicates whether the transactionAmount (see below) is including taxes. Default: false
            - type: boolean
        transactionAmount:
          allOf:
            - description: |
                Transaction amount for the transferred security for the PSU. Potential fees or taxes are reflected as indicated 
                by elements \"amountIncludesFees\" and \"amountIncludesTaxes\".
                Remark: The price denoted here is the price for the whole lot of securities within this transaction, 
                not for a single item.
            - $ref: '#/components/schemas/amount'
        relatedFees:
          allOf:
            - description: |
                Only allowed if amountIncludesFees = true.  In that case Details of the fees that have been applied to
                this transaction (and therefore represent additional costs of the transaction beyond the 
                transactionAmount).
                Fees with positive amount are debited by the PSU, only in the rare case of a fee credited to the PSU 
                (e.g. in case of a reversal) negative amounts are used.
            - type: array
              items:
                $ref: '#/components/schemas/securitiesRelatedFee'
        currencyExchange:
          allOf:
            - description: |
                The ASPSP might include exchange rates e.g. if the transaction has been settled 
                in another currency than the PSU's currency.
            - type: array
              items:
                $ref: '#/components/schemas/reportExchangeRate'
        reversalIndicator:
          allOf:
            - description: |
                 Indicates whether it is the reversal of a previously reported movement. Default: false
            - type: boolean
        reversedTransactionId:
          allOf:
            - description: |
                 \"transactionId\" of the reversed transaction, if applicable and supported by the ASPSP.
            - type: boolean
        unitsNumberBeforeTx:
          allOf:
            - description: |
                Numeric quantification of the financial instrument within the primary position before the
                transaction, negative values for short positions.
            - type: number
        unitsNominalBeforeTx:
          allOf:
            - description: |
                Nominal quantification of the financial instrument within the primary position before the
                transaction, negative values for short positions.
            - $ref: '#/components/schemas/amount'
        unitsNumberAfterTx:
          allOf:
            - description: |
                Numeric quantification of the financial instrument within the primary position after the
                transaction, negative values for short positions.
            - type: number
        unitsNominalAfterAfterTx:
          allOf:
            - description: |
                Nominal quantification of the financial instrument within the primary position after the
                transaction, negative values for short positions.
            - $ref: '#/components/schemas/amount'
        accruedInterest:
          allOf:
            - description: |
                Accrued interest by the position to make transparent what the PSU really lost within this transaction
            - $ref: '#/components/schemas/accruedInterest'
        details:
          allOf:
            - description: |
                Additional details to the transaction. 
            - $ref: '#/components/schemas/Max500Text'
        _links:
          description: |
            The following types of links are supported:
             * \"transactionDetails\": Single link for retrieving details on this specific transaction. Only
               applicable, if the ASPSP supports the Read Securities Transaction Details endpoint. 
          type: object
          additionalProperties: 
            $ref: '#/components/schemas/hrefType'
          properties:
            transactionDetails:
              $ref: '#/components/schemas/hrefType'
    _linksAll:
