    ISIN:
      type: string
      description: |
        International Securities Identification Number (ISIN). A numbering system designed by the United Nation's 
        International Organisation for Standardisation (ISO). The ISIN is composed of a 2-character prefix 
        representing the country of issue, followed by the national security number (if one exists), and a 
        check digit. Each country has a national numbering agency that assigns ISIN numbers for securities in 
        that country.
      pattern: '[A-Z0-9]{12,12}'
    otherType:
      description: In cases where the specifically defined criteria (IBAN, BBAN, MSISDN)
        are not provided to identify an instance of the respective account type (e.g. a savings account), 
        the ASPSP shall include a proprietary ID of the respective account that uniquely identifies the account for this ASPSP.
      type: object
      required: 
        - identification
      properties:
        identification:
          allOf:
            - description: Proprietary identification of the account.
            - $ref: '#/components/schemas/Max35Text'
        issuer:
          allOf:
            - description: Issuer of the identification.
            - $ref: '#/components/schemas/Max35Text'
        schemeNameProprietary:
          allOf:
            - description: A scheme name defined in a proprietary way.
            - $ref: '#/components/schemas/Max35Text'
        schemeNameCode:
          allOf:
            - description: An entry provided by an external ISO code list.
            - $ref: '#/components/schemas/Max35Text'
    MessageCode_401_AIS: 
      allOf:
        - description: Message codes defined for AIS for HTTP Error code 401 (UNAUTHORIZED).
        - oneOf:
          - $ref: '#/components/schemas/MessageCode_401_Generic'
    ISODate:
