        '401':
          $ref: '#/components/responses/decline_401_AIS'
        '403':
          $ref: '#/components/responses/decline_403_AIS'
        '404':
          $ref: '#/components/responses/decline_404_AIS_Securities'
        '405':
          $ref: '#/components/responses/decline_405_AIS'
        '406':
