          description: Up to 20 significant figures. Negative amounts are signed by minus.
            The decimal separator is a dot. Trailing zeroes must be truncated.
          type: string
          pattern: "-?[0-9]{1,20}(\\.[0-9]{0,19})?"
        priceDateTime:
          allOf:
            - description: Date and time of the evaluation of this price.
            - $ref: '#/components/schemas/ISODateTime'
        priceDate:
