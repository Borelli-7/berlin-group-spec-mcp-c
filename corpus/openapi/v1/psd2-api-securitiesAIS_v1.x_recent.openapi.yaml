            - $ref: '#/components/schemas/amount'
        _links:
          allOf:
            - description: |
                Links to resources, where the ASPSP can provide additional
                information on the fee, e.g. an overview on the general fee
                rules of the underlying securities account. Currently, no specific href
                types are defined in this context.
          type: object
          additionalProperties: 
            $ref: '#/components/schemas/hrefType'
