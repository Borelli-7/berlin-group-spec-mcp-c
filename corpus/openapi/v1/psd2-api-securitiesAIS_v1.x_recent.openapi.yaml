            - description: |
                Minimum amount of the fee in each billing period / for each billed event, if applicable.
            - $ref: '#/components/schemas/amount'
        maximumAmount:
          allOf:
            - description: |
                Maximum amount of the fee in each billing period / for each billed event, if applicable.
            - $ref: '#/components/schemas/amount'
