          <tr>
            <td>WKNR</td>
            <td>WertpapierkennummerWKN</td>
            <td>
              National securities identification number for DE issued by the National Numbering Association 
              WM Datenservice.
            </td>
          </tr>
          <tr>
            <td>CCDC</td>
            <td>BondIdentificationCodeListChina</td>
            <td>
              National Bond identification number for China issued by CHINA CENTRAL DEPOSITORY & CLEARING CO.
              , Limited.
            </td>
          </tr>
        </table>
      type: string
    accountDetailsSecurities:
      description: |
        Extended defintion of the \"Account Details\" Structure to represent Securities Accounts.
      type: object
      required:
        - resourceId
        - currency
      properties:
        resourceId:
          description: |
              This is the data element to be used in the path when retrieving data from a dedicated account.
          type: string
        iban:
          allOf:
            - description: |
                This data element can be used in the body of the Consent Request Message for retrieving account 
                access consent from this account.
            - $ref: '#/components/schemas/IBAN'
        bban:
          allOf:
            - description: |
                This data element can be used in the body of the Consent Request Message for retrieving account 
                access consent from this account. This data elements is used for payment accounts which have no IBAN.
            - $ref: '#/components/schemas/BBAN'
        msisdn:
          allOf:
            - description: |
                An alias to access an account via a registered mobile phone number. 
                This alias might be needed e.g. in the payment initiation service. 
                The support of this alias must be explicitly documented by the ASPSP 
                for the corresponding API Calls.
            - $ref: '#/components/schemas/Max35Text'
        other:
          allOf:
            - description: |
                In cases where the criteria listed above (IBAN, BBAN, MSISDN) are not provided to identify an 
                instance of the respective account type (e.g. a securities account), the ASPSP shall include a 
                proprietary ID of the respective account that uniquely identifies the account for this ASPSP.
            - $ref: '#/components/schemas/otherType'
        currency:
          allOf:
            - description: |
                Account currency. If the (e.g. securities) account does not have a dedicated account currency, 
                code \"XXX\" is used.
            - $ref: '#/components/schemas/CurrencyCode'
        ownerName:
          allOf:
            - description: |
                Name of the legal account owner. If there is more than one owner, then e.g. two names might be noted here.
                For a corporate account, the corporate name is used for this attribute.
                Even if supported by the ASPSP, the provision of this field might depend on the fact whether an explicit 
                consent to this specific additional account information has been given by the PSU.
            - $ref: '#/components/schemas/Max140Text'
        name:
          allOf:
            - description: |
                Name of the account, as assigned by the ASPSP, in agreement with the account owner in order to provide an additional 
                means of identification of the account.
            - $ref: '#/components/schemas/Max70Text'
        displayName:
          allOf:
            - description: |
                Name of the account as defined by the PSU within online channels.
            - $ref: '#/components/schemas/Max70Text'
        product:
          allOf:
            - description: |
                Product Name of the ASPSP for this account, proprietary definition.
            - $ref: '#/components/schemas/Max35Text'
        cashAccountType:
          allOf:
            - description: |
                ExternalCashAccountType1Code from ISO 20022. Might be extended by an additional code to indicate 
                securities accounts. A global definition of a code for securities accounts is intentionally not 
                provided by this document.
            - $ref: '#/components/schemas/ExternalCashAccountType'
        status:
          description: |
            Account status. The value is one of the following:
              * \"enabled\": account is available
              * \"deleted\": account is terminated
              * \"blocked\": account is blocked e.g. for legal reasons
            If this field is not used, than the account is available in the sense of this specification.
          type: string
          enum:
            - "enabled"
            - "deleted"
            - "blocked"
        bic:
          allOf:
            - description: |
                The BIC associated with the account.
            - $ref: '#/components/schemas/BICFI'
        linkedAccounts:
          allOf:
            - description: |
                This data attribute is a field, where an ASPSP can name a cash account associated with the 
                (e.g. securities) account.
            - $ref: '#/components/schemas/Max70Text'
        usage:
          description: |
            Specifies the usage of the account:
              * PRIV: private personal account
              * ORGA: professional account
          type: string
          maxLength: 4
          enum:
            - "PRIV"
            - "ORGA"
        details:
          allOf:
            - description: |
                Specifications that might be provided by the ASPSP:
                  * characteristics of the account
                  * characteristics of the relevant card
                  * characteristics of the savings account, and the ASPSP will provide specification for each deposit
                  * characteristics of the loan
            - $ref: '#/components/schemas/Max500Text'
        balances:
          description: |
            A list of balances regarding this account, e.g. the current balance, the last booked balance.
            The list might be restricted to the current balance.
          type: array
          items:
            $ref: '#/components/schemas/balanceSecurities'
        tariffs:
          allOf:
            - description: |
                Text information on tariffs related to this securities account.
            - $ref: '#/components/schemas/Max1000Text'
        applicableFees:
          allOf:
            - description: |
                Array of elements, each representing one fee (rule) that is individually applicable for this 
                Securities account. If, for example, an ASPSP applies a standard \"managementFee\" X, but the
                consumer negotiated a discount D, an element should represent (X-D), but neither X nor D.
          type: array
          items:
            $ref: '#/components/schemas/securitiesAccountFee'
        _links:
          description: |
            Links to the account, which can be directly used for retrieving account
            information from this dedicated account.
            Links to \"positions\", \"orders\" or \"transactions\".
            These links are only supported, when the corresponding consent has been already granted. 
          type: object
          additionalProperties: 
            $ref: '#/components/schemas/hrefType'
          properties:
            positions:
              $ref: '#/components/schemas/hrefType'
            orders:
              $ref: '#/components/schemas/hrefType'
            transactions:
              $ref: '#/components/schemas/hrefType'
    error_NG_403_AIS: 
      type: object
      properties:
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/tppMessage_403_AIS'
        _links:
          $ref: '#/components/schemas/_linksAll'
    error_RFC7807_409_AIS: 
      description: |
