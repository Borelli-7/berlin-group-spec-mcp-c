openapi: 3.0.1

info:
  title: openFinance API Framework Implementation Guidelines for Extended Services AIS for Securities Accounts
  version: "1.0"
  description: |
    With the XS2A Specification [XS2A-IG], a standard for an XS2A Interface is defined for the core services defined by the PSD2.
    With [oFA-IG-SecAIS] an extension of the NextGenPSD2 XS2A Specification [XS2A-IG]. It describes how the existing services for 
    account information can be extended to provide account information on securities accounts. Therefore, new endpoints are 
    defined in order to provide the information.This yaml file reflects the API definition given in [oFA-IG-SecAIS] and therefore 
    provides the (essentially) same information regarding the data definition in a machine readable form.
      **[XS2A-IG]** NextGenPSD2 XS2A Framework, Implementation Guidelines, The Berlin Group Joint Initiative on a PSD2 Compliant XS2A Interface, version 1.3.12, published 01 July 2022.
      **[oFA-IG-SecAIS]** openFinance API Framework Implementation Guidelines for Extended Services AIS for Securities Accounts
  license:
    name: Creative Commons Attribution 4.0 International Public License
    url: https://creativecommons.org/licenses/by/4.0/
  contact:
    name: The Berlin Group - A European Standards Initiative
    url: https://www.berlin-group.org/
    email: info@berlin-group.org

