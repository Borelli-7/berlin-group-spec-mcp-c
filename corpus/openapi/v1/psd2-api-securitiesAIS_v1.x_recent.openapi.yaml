components:
  securitySchemes:
    BearerAuthOAuth:
      description: |
        Bearer Token. 
        Is contained only, if an OAuth2 based authentication was performed in a pre-step or 
        an OAuth2 based SCA was performed in a preceding AIS service in the same session.
      type: http
      scheme: bearer
  schemas:
    error_RFC7807_429_AIS: 
      description: |
        Standardised definition of reporting error information according to [RFC7807].
      type: object
      required:
        - type
        - code
      properties:
        type: 
          description: |
            A URI reference [RFC3986] that identifies the problem type. 
            Remark For Future: These URI will be provided by NextGenPSD2 in future.
          type: string
          format: uri
          maxLength: 70
        title:
          $ref: '#/components/schemas/Max70Text'
        detail:
          description: |
                $ref: '#/components/schemas/Max500Text'
        code:
          $ref: '#/components/schemas/MessageCode_429_AIS'
        additionalErrors:
          description: |
            Array of Error Information Blocks.
            Might be used if more than one error is to be communicated
          type: array
          items: #ErrorInformation
            description: This is a data element to support the declaration of additional errors in the context of [RFC7807]. 
            type: object
            required:
              - code
            properties:
              title:
                $ref: '#/components/schemas/Max70Text'
              detail:
                $ref: '#/components/schemas/Max500Text'
              code:
                $ref: '#/components/schemas/MessageCode_429_AIS'
        _links:
          $ref: '#/components/schemas/_linksAll'
    TradingSessionTypeCode:
      description: |
        Code set to identify the type of a trading session, in which an order shall be executed. Possible values:
        * **auctions**: Orders that are traded in regularly occurring auctions: orders are 
          accumulated and executed on the basis of defined algorithms.
        * **continuous**: Orders that are executed directly against each other as they hit the marketplace.
      type: string
      enum:
       - auctions
       - continuous
    MessageCode_405_AIS: 
      description: Message codes defined for AIS for HTTP Error code 405 (METHOD NOT ALLOWED).
      type: string
      enum: 
        - "SERVICE_INVALID"           #gens
    SecuritiesOrderSide: 
      description: |
        Code set to identify the \"side\" / intended action for the respective order. 
      type: string
      enum:
        - buy
        - sell
        - subscription
        - redemption
    error_NG_400_AIS: 
      type: object
      properties:
        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/tppMessage_400_AIS'
        _links:
          $ref: '#/components/schemas/_linksAll'
    tppMessage_403_AIS:
      type: object
      required:
        - category
        - code
      properties:
        category:
           $ref: '#/components/schemas/TppMessageCategory'
        code:
          $ref: '#/components/schemas/MessageCode_403_AIS'
        path:
          type: string
        text:
          $ref: '#/components/schemas/Max500Text'
    evaluatedAmount:
      description: This data structure represents an evaluated amount (without indicating the method of evaluation) 
        when an unambiguous balance cannot be provided, but an evaluation, e.g. the  value of a securities position.
      type: object
      required: 
        - amount
      properties:
        amount:
          allOf:
            - description: Amount that is evaluated.
            - $ref: '#/components/schemas/amount'
        evaluationDateTime:
          allOf:
            - description: Date and time of the evaluation.
            - $ref: '#/components/schemas/ISODateTime'
        evaluationDate:
          allOf:
            - description: Date of the evaluation.
            - $ref: '#/components/schemas/ISODate'
    otherFinancialInstrumentIdentification:
      description: |
        This data element structure represents the identification of a financial instrument by means other than ISIN.
      type: object
      required: 
        - identification
      properties:
        identification:
          allOf:
            - description: Identification of a security.
            - $ref: '#/components/schemas/Max35Text'
        suffix:
          allOf:
            - description: Identifies the suffix of the security identification.
            - $ref: '#/components/schemas/Max16Text'
        typeCode:
          allOf:
            - description: Unique and unambiguous identification source, as assigned via a pre-determined code list.
            - $ref: '#/components/schemas/ExternalFinancialInstrumentIdentificationType1Code'
        typeProprietary:
          allOf:
            - description: Unique and unambiguous identification source using a proprietary identification scheme.
            - $ref: '#/components/schemas/Max35Text'
    securitiesPosition:
      description: |
        This data element structure represents the identification of a financial instrument by means other than ISIN.
      type: object
      required:
        - financialInstrument
      properties: 
        financialInstrument:
          allOf:
            - description: |
                Financial Instrument that is contained in this position.
            - $ref: '#/components/schemas/financialInstrument'
        unitsNumber:
          allOf:
            - description: |
                Numeric quantification of the financial instrument. Negative values for short positions.
            - type: number
        unitsNominal:
          allOf:
            - description: |
                Nominal quantification of the financial instrument. Negative values for short positions.
            - $ref: '#/components/schemas/amount'
        externalIdentifier:
          allOf:
           - description: |
                Name or identifier with an intrinsic meaning for the PSU to be displayed.
           - $ref: '#/components/schemas/Max35Text'
        safekeepingPlace:
          allOf:
            - description: |
                BIC of the place where the securities are safe-kept, physically or notionally. 
            - $ref: '#/components/schemas/BICFI'
        safekeepingCountry:
          allOf:
            - description: |
                Country where the securities are safe-kept.
            - $ref: '#/components/schemas/CountryCode'
        balanceType:
          allOf:
             - description: |
                Specifies the nature of the securities or investment fund balance.
                Type of balance in case of multiple positions for the same financial instrument for 
                further distinction.
                *Remark:* In consequence, several positions with the same financial instrument may occur in the same position list, 
                having different values of \"balanceType\".
             - $ref: '#/components/schemas/SecuritiesBalanceType_1_2_11_12_Code'
        averageBuyingPrice:
          allOf:
            - description: |
                Average buying price of the position excluding any fees or taxes.
            - $ref: '#/components/schemas/amount'
        averageSellingPrice:
          allOf:
            - description: |
                Average selling price of the position, e.g. in case of a short position. Price excluding any fees or taxes.
            - $ref: '#/components/schemas/amount'
        totalBuyingPrice:
          allOf:
            - description: |
                In case of bonds, an average buying price does not make sense. 
                Therefore, the total buying price excluding any fees or taxes can be shown displayed instead.
            - $ref: '#/components/schemas/amount'
        estimatedCurrentValue:
          allOf:
            - description: |
                Estimated value of the position and timestamp of the estimation.
            - $ref: '#/components/schemas/evaluatedAmount'
        accruedInterest:
          allOf:
