    MessageCode_404_AIS_Securities: 
      allOf:
        - description: Message codes defined for AIS for HTTP Error code 404 (NOT FOUND).
        - oneOf:
          - $ref: '#/components/schemas/MessageCode_404_Generic'
          - type: string
            enum: 
            - "CONTENT_TEMPORARILY_NOT_AVAILABLE"          #Securities AIS specific error condition
    tppMessage_401_AIS:
      type: object
      required:
        - category
        - code
      properties:
        category:
           $ref: '#/components/schemas/TppMessageCategory'
        code:
          $ref: '#/components/schemas/MessageCode_401_AIS'
        path:
          type: string
        text:
          $ref: '#/components/schemas/Max500Text'
    amount:
      type: object
      required:
        - currency
        - amount
      properties:
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        amount:
          description: |
            The amount given with fractional digits, where fractions must be compliant to the currency definition.
            Up to 14 significant figures. Negative amounts are signed by minus.
            The decimal separator is a dot.
            **Example:**
            Valid representations for EUR with up to two decimals are:
              * 1056
              * 5768.2
              * -1.50
              * 5877.78
          type: string
          pattern: "-?[0-9]{1,14}(\\.[0-9]{1,3})?"
          example: "5877.78"
      example: 
        {
          "currency": "EUR", 
          "amount": "123"
        }
    reportExchangeRate:
      description: Exchange Rate.
      type: object
      required:
        - sourceCurrency
        - exchangeRate
        - unitCurrency
        - targetCurrency
        - quotationDate
      properties:
        sourceCurrency:
          allOf:
            - description: |
            - $ref: '#/components/schemas/CurrencyCode'
        exchangeRate:
          allOf:
            - description: |
            - type: string
        unitCurrency:
          allOf:
            - description: |
            - $ref: '#/components/schemas/CurrencyCode'
        targetCurrency:
          allOf:
            - description: |
            - $ref: '#/components/schemas/CurrencyCode'
        quotationDate:
          allOf:
            - description: |
            - $ref: '#/components/schemas/ISODate'
        contractIdentification:
          allOf:
            - description: |
            - $ref: '#/components/schemas/Max35Text'
