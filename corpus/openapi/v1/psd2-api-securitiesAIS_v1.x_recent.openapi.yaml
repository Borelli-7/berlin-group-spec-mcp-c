        scaStatus:
          $ref: '#/components/schemas/hrefType'
        account:
          $ref: '#/components/schemas/hrefType'
        balances:
          $ref: '#/components/schemas/hrefType'
        positions:
          $ref: '#/components/schemas/hrefType'
        orders:
          $ref: '#/components/schemas/hrefType'
        transactions:
          $ref: '#/components/schemas/hrefType'
        transactionDetails:
          $ref: '#/components/schemas/hrefType'
        cardAccount:
          $ref: '#/components/schemas/hrefType'
        cardTransactions:
          $ref: '#/components/schemas/hrefType'
        relatedOrders:
          allOf:
            - description: |
                An array of links to request order details of related orders (e.g. other
                orders that originated from the same order split as this order).
                Only applicable, if the ASPSP supports the Read Securities Order Details endpoint.
            - type: array
              items:
                $ref: '#/components/schemas/hrefType'
        relatedTransactions:
          allOf:
            - description: |
                An array of links to request securities transaction details of transactions that resulted
                from this order. 
                Only applicable, if the ASPSP supports the Read Securities Transaction Details endpoint.
            - type: array
              items:
                $ref: '#/components/schemas/hrefType'
        orderDetails:
          allOf:
            - description: |
                Single link for retrieving details on this specific order. 
                Only applicable, if the ASPSP supports the Read Securities Order Details endpoint.
            - $ref: '#/components/schemas/hrefType'
        first:
          $ref: '#/components/schemas/hrefType'
        next:
          $ref: '#/components/schemas/hrefType'
        previous:
          $ref: '#/components/schemas/hrefType'
        last:
          $ref: '#/components/schemas/hrefType'
        download:
          $ref: '#/components/schemas/hrefType'
    Max16Text:
      type: string
      maxLength: 16
    accruedInterest:
      type: object
      properties:
        daysAccrued:
          allOf:
            - description: Specifies the number of days used for calculating the accrued interest amount.
            - type: number
        amounts:
          allOf:
            - description: Amount of the accrued interest. Each item represents the same monetary value in 
                different currencies, e.g. account currency, currency of the security's denomination.
            - type: array
              items:
                $ref: '#/components/schemas/amount'
    securitiesAccountFeeRule:
      description: |
        Represents parameters of a given type of fee (represented by the overlying Securities Fee Rule) as they apply 
        if the volume of certain (not explicitly mentioned) statistics of the account / PSU lies in the intervall from
        a certain \"fromBaseAmount\" to a certain \"toBaseAmount\".
      type: object
      properties:
        amount:
          allOf:
            - description: |
                Amount of the fee.
            - $ref: '#/components/schemas/amount'
        percentage:
          description: Percentage of the fee. Up to 20 significant figures. Negative amounts are signed by minus.
            The decimal separator is a dot. Trailing zeroes must be truncated.
          type: string
          pattern: "-?[0-9]{1,20}(\\.[0-9]{0,19})?"
        fromBaseAmount:
          allOf:
            - description: |
                To be used for fees where a tiered percentage is used to calculate the fee relative to an implicitly defined 
                base amount (such as a transaction's volume being the base amount for a courtage).
                The range of one tier is defined as all applicable entities with base amounts X and 
                fromBaseAmount \<\= X \<\= toBaseAmount
                In any array of fee rules, only one of these entries may be missing the
                \"fromBaseAmount\" element (indicating that the rule represented by this entry is
                used without a lower bound to the base amount) and only one entry may be missing the
                \"toBaseAmount\" element (indicating that the rule represented by this entry is applied 
                without an upper limit to the base amount).
                In cases, where the fee is not calculated as a tiered percentage, only one entry in array \"feeRules\" is included.
                This entry must be missing the subelements \"fromBaseAmount\" and \"toBaseAmount\".
            - $ref: '#/components/schemas/amount'
        toBaseAmount:
          allOf:
            - description: |
                To be used for fees where a tiered percentage is used to calculate the fee relative to an implicitly defined 
                base amount (such as a transaction's volume being the base amount for a courtage).
                The range of one tier is defined as all applicable entities with base amounts X and 
                fromBaseAmount \<\= X \<\= toBaseAmount
                In any array of fee rules, only one of these entries may be missing the
                \"fromBaseAmount\" element (indicating that the rule represented by this entry is
                used without a lower bound to the base amount) and only one entry may be missing the
                \"toBaseAmount\" element (indicating that the rule represented by this entry is applied 
                without an upper limit to the base amount).
                In cases, where the fee is not calculated as a tiered percentage, only one entry in array \"feeRules\" is included.
                This entry must be missing the subelements "fromBaseAmount" and "toBaseAmount".
            - $ref: '#/components/schemas/amount'
