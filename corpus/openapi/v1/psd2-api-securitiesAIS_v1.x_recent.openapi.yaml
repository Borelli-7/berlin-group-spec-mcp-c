        tppMessages:
          type: array
          items:
            $ref: '#/components/schemas/tppMessage_429_AIS'
        _links:
          $ref: '#/components/schemas/_linksAll'
    TransactionActivityType1Code:
      description: |
        TransactionActivityType1Code from ISO 20022.
        Compare 
        ISO 20022
        Settlement And Reconciliation - ISO - Maintenace 2019 - 2020
        Message Definition Report - Part 2
        Approved by the Securities SEG on the 27th of January 2020:
        <table border="1">
          <tr>
            <th>CodeName</th>
            <th>Name</th>
            <th>Definition</th>
          </tr>
          <tr>
            <td>BOLE</td>
            <td>BorrowingLendingActivity</td>
            <td>Transaction relates to lending/borrowing.</td>
          </tr>
          <tr>
            <td>CLAI</td>
            <td>MarketClaim</td>
            <td>Transaction relates to a market claim following a corporate action.</td>
          </tr>
          <tr>
            <td>COLL</td>
            <td>CollateralActivity/td>
            <td>Transaction relates to collateral.</td>
          </tr>
          <tr>
            <td>CORP</td>
            <td>CorporateActionActivity</td>
            <td>Transaction relates to corporate action.</td>
          </tr>
          <tr>
            <td>SETT</td>
            <td>SettlementandClearingActivity</td>
            <td>Transaction relates to settlement and clearing.</td>
          </tr>
        </table>
      type: string
      enum:
        - BOLE
        - CLAI
        - COLL
        - CORP
        - SETT
    ExternalCashAccountType:
      description: |
        ExternalCashAccountType1Code from ISO 20022.
      type: string
    BICFI: 
