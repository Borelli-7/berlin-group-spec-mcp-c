        note: Revocation/cancellation of payment initiations
      - source_id: bg-openfinance-v2-xs2a-operational-rules
        locator: page:32-33
    acceptance_criteria:
      - "The PSU can revoke all future dated payments directly with the ASPSP."
      - "The PSU can change or terminate a recurring payment directly at the ASPSP."
      - "The ASPSP ensures PSU revocation of PIS payment initiations meets article 80 PSD2 and national law."
    tags: [operational-rules, pis, cancellation]

  - id: OFV2-OPS-XS2A-SERVICES-001
    version: openfinance-v2
    title: XS2A API services, TPP roles and non-discrimination
    sources:
      - source_id: bg-openfinance-v2-xs2a-operational-rules
        locator: section:4
        note: API Services supported for the core services
      - source_id: bg-openfinance-v2-xs2a-operational-rules
