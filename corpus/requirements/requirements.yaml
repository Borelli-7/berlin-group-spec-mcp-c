    tags: [ais, balances, baseline]

  - id: NGPSD2-CONSENT-AIS-001
    version: nextgenpsd2-v1.3
    title: Establish an account information consent (NextGenPSD2 1.3.16 baseline)
    sources:
      - source_id: bg-nextgenpsd2-v1.3-implementation-guidelines
        locator: section:6.3.1
        note: Account Information Consent Request
      - source_id: bg-nextgenpsd2-v1.3-implementation-guidelines
        locator: page:155-158
      - source_id: bg-nextgenpsd2-v1.3-implementation-guidelines
        locator: page:309
        note: ACCESS_EXCEEDED
      - source_id: bg-nextgenpsd2-v1.3-openapi
        locator: op:POST /v1/consents
    endpoints:
      - POST /v1/consents
    schemas:
      - consents
    acceptance_criteria:
      - "access, recurringIndicator, validUntil, frequencyPerDay and combinedServiceIndicator are mandatory in the request body."
      - "frequencyPerDay is at least 1 and, unless agreed bilaterally, at most 4."
      - "A successful response has HTTP 201 and contains consentStatus and consentId."
      - "Accesses beyond the consented frequency without PSU involvement are rejected with HTTP 429 ACCESS_EXCEEDED."
    tags: [consent, ais, baseline]
