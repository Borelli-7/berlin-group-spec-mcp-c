      - source_id: bg-openfinance-v2-xs2a-operational-rules
        locator: page:32-33
      - source_id: bg-openfinance-v2-xs2a-operational-rules
        locator: page:28
    acceptance_criteria:
      - "A TPP may only execute an API service if it holds the role indicated for that service."
      - "Single payment initiation is mandatory."
      - "Confirmation of funds is mandatory and answers only YES or NO."
      - "The ASPSP responds to every correctly identified TPP without discrimination."
      - "A TPP uses only one role per API service, confirmed by its certificate."
    tags: [operational-rules, xs2a]

  - id: OFV2-OPS-XS2A-VALIDITY-001
