      - "The Consent API PDF contains changes up to version 2.2.1, while the Consent OpenAPI declares 2.1."
    tags: [versioning, errata]

  # ======================================================== openFinance v2 - Extended services: Verification of Party (VOP)
  - id: OFV2-VOP-SINGLE-001
    version: openfinance-v2
    title: Verification of party request (dedicated VOP API)
    sources:
      - source_id: bg-openfinance-v2-vop
        locator: section:3.3
        note: API Access Methods
      - source_id: bg-openfinance-v2-vop
        locator: section:3.4.1
        note: Verification of Party Request
      - source_id: bg-openfinance-v2-vop
        locator: page:20-25
      - source_id: bg-openfinance-v2-openapi-vop
        locator: op:POST /v2/{party-verification-endpoint}
    endpoints:
      - POST /v2/{party-verification-endpoint}
    acceptance_criteria:
      - "POST {party-verification-endpoint} is mandatory for the ASPSP; supported endpoint values are payee-verifications, payer-verifications and party-verifications."
      - "Supporting payee-verifications is sufficient to fulfil the instant payment regulation."
      - "X-Request-ID is mandatory; API-Contract-ID is conditional on an onboarding contract; Accept-language is optional and may be ignored."
      - "partyAccount and party (party name and/or party identification) are mandatory in the request body; partyAgent and unstructuredRemittanceInformation are optional; requestingAgent is not applicable."
      - "A successful response has HTTP 200; partyNameMatch is provided only if a party name was provided, and partyIdMatch only if a party identification was provided."
      - "matchedName may be provided in case of a near match; additionalInformation is optional human-readable text."
    tags: [vop, extended-services]

  - id: OFV2-VOP-BULK-001
    version: openfinance-v2
    title: Bulk verification of party request, retrieval and status
    sources:
      - source_id: bg-openfinance-v2-vop
        locator: section:3.3
        note: API Access Methods
      - source_id: bg-openfinance-v2-vop
        locator: section:3.4.2
        note: Bulk Verification of Party Request
      - source_id: bg-openfinance-v2-vop
        locator: section:3.4.3
        note: Retrieve Bulk Verification of Party Request
      - source_id: bg-openfinance-v2-vop
        locator: section:3.4.4
        note: Get Status of Bulk Verification of Party Request
      - source_id: bg-openfinance-v2-vop
        locator: page:20
      - source_id: bg-openfinance-v2-vop
        locator: page:26-34
      - source_id: bg-openfinance-v2-openapi-vop
        locator: op:POST /v2/{bulk-party-verification-endpoint}
      - source_id: bg-openfinance-v2-openapi-vop
        locator: op:GET /v2/{bulk-party-verification-endpoint}/{vopBulkId}
      - source_id: bg-openfinance-v2-openapi-vop
        locator: op:GET /v2/{bulk-party-verification-endpoint}/{vopBulkId}/status
    endpoints:
      - POST /v2/{bulk-party-verification-endpoint}
      - GET /v2/{bulk-party-verification-endpoint}/{vopBulkId}
      - GET /v2/{bulk-party-verification-endpoint}/{vopBulkId}/status
    acceptance_criteria:
      - "POST {bulk-party-verification-endpoint} is optional for the ASPSP; GET of the vop bulk resource and of its status are conditional on a vopBulkId resource having been created."
      - "Supported endpoint values are bulk-payee-verifications, bulk-payer-verifications and bulk-party-verifications."
      - "partyVerificationRequests is a mandatory non-empty array in the bulk request; Client-Asynchronous-Process-Preferred is optional and may be ignored by the ASPSP."
      - "The bulk request is answered with HTTP 200 when all results are available and HTTP 202 when processing is not completed."
      - "vopBulkStatus is mandatory; vopBulkId and a _links element with at least a status link are provided only with HTTP 202; partyVerificationResponses is provided if (even partial) results are available."
      - "GET of the vop bulk resource returns HTTP 200 with mandatory vopBulkId, vopBulkStatus and partyVerificationRequestsAndResults."
      - "GET of the vop bulk status returns HTTP 200 with mandatory vopBulkId and vopBulkStatus, and optionally either reasonCode or reasonProprietary."
    tags: [vop, extended-services, bulk]

  - id: OFV2-VOP-CREDITOR-CONFIRMATION-001
    version: openfinance-v2
    title: Confirmation of creditor name and payment after a VOP mismatch
    sources:
      - source_id: bg-openfinance-v2-vop
        locator: section:4.1
        note: New codes for transaction status
      - source_id: bg-openfinance-v2-vop
        locator: section:4.5
        note: New Method for Confirmation of Creditor Name and Payment
      - source_id: bg-openfinance-v2-vop
        locator: page:35
      - source_id: bg-openfinance-v2-vop
        locator: page:40-42
      - source_id: bg-openfinance-v2-openapi-vop
        locator: op:PUT /v2/{payment-service}/{payment-product}/{paymentId}/creditor-confirmation
    endpoints:
      - PUT /v2/{payment-service}/{payment-product}/{paymentId}/creditor-confirmation
    acceptance_criteria:
      - "VOP integration into payment APIs is an extended service, offered only if provided by the ASPSP or agreed in an API Access Scheme."
      - "Transaction status RVCM means the VOP result requires an explicit confirmation by the payer; RVNC means VOP is not yet completed; RCVC means VOP is completed and no further confirmation is required."
      - "A payment or bulk payment with status RVCM is not processed; for a bulk only the full bulk can be confirmed."
      - "In case of no match, near match or no match applied, the payment is only initiated after the PSU's explicit confirmation via PUT .../creditor-confirmation."
      - "The creditor confirmation request has a mandatory X-Request-ID header and no body."
      - "A successful creditor confirmation has HTTP 200 with mandatory transactionStatus and _links; challengeData and scaMethods are conditional."
    tags: [vop, extended-services, pis]

