      - source_id: bg-nextgenpsd2-v1.3-implementation-guidelines
        locator: page:181-183
      - source_id: bg-nextgenpsd2-v1.3-openapi
        locator: op:GET /v1/accounts/{account-id}/balances
    endpoints:
      - GET /v1/accounts/{account-id}/balances
